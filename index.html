<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hold Rep">
<meta name="theme-color" content="#0b0d10">
<title>Hold Rep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 首页 -->
<section class="view page" id="v-home">
  <header class="brand"><h1><img src="icons/icon-192.png" alt="">Hold Rep</h1><p>单杠自动计时 · 计数</p>
    <button class="gear" id="goSettings" aria-label="设置"><i data-ico="settings"></i></button></header>
  <div class="stack">
  <button class="card mode" data-mode="hang">
    <span class="ico" data-ico="hang"></span><span><b>Dead Hang 计时</b><small>抓杠悬垂，自动开始 / 暂停 / 接续</small></span>
  </button>
  <button class="card mode" data-mode="pullup">
    <span class="ico" data-ico="pullup"></span><span><b>Pull-up 计数</b><small>引体向上，正握 / 反握均可，拉起到顶 + 回到伸直算 1 次</small></span>
  </button>
  <div class="row2">
    <button class="card small" id="goHistory"><i data-ico="list"></i>历史记录</button>
    <button class="card small" id="goReport"><i data-ico="chart"></i>数据报表</button>
  </div>
  </div>
  <p class="hint">手机竖屏放在单杠前方的地面或低处，稍微仰拍，让画面拍到单杠和全身。Dead Hang 必须拍到双脚，用来判断是否离地。</p>
  <p class="hint ver" id="ver"></p>
</section>

<!-- 训练页 -->
<section class="view" id="v-train">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="shade-top"></div>
  <div class="hud">
    <div class="hud-top">
      <button id="btnBack" class="back">‹ 返回</button>
      <span class="chips"><button id="bigToggle" class="pill chip">Aa</button><button id="perf" class="pill chip"></button></span>
    </div>
    <div id="pill" class="pill">准备中</div>
    <div id="hudHang" class="hud-nums">
      <div><small>当前段</small><div id="hCur" class="big">0:00.0</div></div>
      <div><small>本轮总计</small><div id="hTot" class="big">0:00.0</div></div>
    </div>
    <div id="hudPull" class="hud-nums center">
      <div><small id="pLabel">次数</small><div id="pCount" class="big huge">0</div></div>
    </div>
  </div>
  <div class="controls">
    <button id="btnStart" class="btn go">开始</button>
    <button id="btnPause" class="btn">暂停</button>
    <button id="btnEnd" class="btn stop">结束</button>
  </div>
  <div id="trainMsg" class="cover" hidden></div>
</section>

<!-- 结果 / 详情页 -->
<section class="view page" id="v-result">
  <header class="bar"><h2 id="rTitle">本轮结果</h2></header>
  <div id="rBody"></div>
  <div class="actions" id="rActions"></div>
</section>

<!-- 设置 -->
<section class="view page" id="v-settings">
  <header class="bar"><button class="back" data-home>‹ 首页</button><h2>设置</h2></header>
  <div class="stack">
  <div class="card"><small style="color:var(--mute)">数字显示（训练页右上角「Aa」也可切换）</small>
    <div class="seg" id="segBig" style="margin:8px 0 0"><button data-v="1">大字（类秒表）</button><button data-v="0">标准</button></div></div>
  <div class="card"><small style="color:var(--mute)">识别模型（精准：动作分析更准；快速：手机发热或卡顿时用）</small>
    <div class="seg" id="segPose" style="margin:8px 0 0"><button data-v="heavy">精准 Heavy</button><button data-v="full">快速 Full</button></div></div>
  <div class="card" style="display:flex;align-items:center;gap:12px"><small style="color:var(--mute);flex:1">体重（用于估算消耗的大卡，写入健康）</small>
    <input id="weight" type="number" inputmode="decimal" min="20" max="250" step="0.1" placeholder="未填"
      style="width:84px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#11151b;color:#fff;font-size:17px;text-align:right"><span>kg</span></div>
  <div class="card"><small style="color:var(--mute)">记录备份（删除主屏 App 会同时删除它的全部记录，删除前请先导出）</small>
    <div class="row2" style="margin-top:10px"><button class="abtn" id="btnExport">导出记录</button><button class="abtn" id="btnImport">导入记录</button></div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="hint" id="backupMsg" style="margin:10px 0 0"></p></div>
  </div>
</section>

<!-- 历史 -->
<section class="view page" id="v-history">
  <header class="bar"><button class="back" data-home>‹ 首页</button><h2>历史记录</h2></header>
  <div id="hList"></div>
</section>

<!-- 报表 -->
<section class="view page" id="v-report">
  <header class="bar"><button class="back" data-home>‹ 首页</button><h2>数据报表</h2></header>
  <div id="repStats" class="stats"></div>
  <div class="seg" id="segMetric">
    <button data-v="hang" class="on">悬垂时长</button><button data-v="pullup">引体次数</button>
  </div>
  <div class="seg" id="segRange">
    <button data-v="7" class="on">近 7 天</button><button data-v="30">近 30 天</button>
  </div>
  <div class="card chart" id="chart"></div>
  <p class="hint" id="chartSum"></p>
</section>

<script src="js/version.js"></script>
<script src="js/config.js"></script>
<script src="js/detectors.js"></script>
<script src="js/report.js"></script>
<script src="js/db.js"></script>
<script src="js/models.js"></script>
<script src="js/app.js"></script>
</body>
</html>
